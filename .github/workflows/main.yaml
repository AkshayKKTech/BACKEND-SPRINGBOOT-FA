name: Springboot backend deplpoy

on:
  push:
    branches: ["main","master"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: namespace1/repo1

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
    
      - name: Set up jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Unit test
        run:  mvn clean test

      - name: Build executable files
        run: mvn package -DskipTests

      - name: Upload artifactory
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: Project__Springboot( backend-fai)/target.jar


  Dockerlogin_push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      
      - name: Download artifactory
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: Project__Springboot( backend-fai)/target.jar


      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/{{ ECR_REPOSITORY }}:{{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/{{ ECR_REPOSITORY }}:latest
        








